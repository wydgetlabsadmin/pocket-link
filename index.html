<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Codex" />
    <title>Codex</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        background: #101014;
        color: #f2f2f5;
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { padding: 32px; max-width: 26rem; text-align: center; }
      h1 { font-size: 1.1rem; font-weight: 600; margin: 0 0 8px; }
      p { margin: 0; color: #a3a3ad; font-size: 0.9rem; }
      button {
        margin-top: 20px;
        padding: 12px 20px;
        border: 0;
        border-radius: 999px;
        background: #f2f2f5;
        color: #101014;
        font: inherit;
        font-weight: 600;
      }
      .spin {
        width: 22px; height: 22px; margin: 0 auto 16px;
        border: 2px solid #3a3a44; border-top-color: #f2f2f5;
        border-radius: 50%; animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(1turn); } }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <div class="spin" id="spin"></div>
      <h1 id="title">Opening Codex…</h1>
      <p id="detail">Finding your Mac.</p>
      <button id="retry" hidden>Try again</button>
    </main>
    <script>
      /*
       * This page is public and never changes. The Mac publishes an encrypted
       * blob (AES-GCM) holding the *current* tunnel address and its token; the
       * key lives only in this page's URL fragment, which the browser never
       * sends to a server. So the bookmark below stays valid forever even
       * though the tunnel hostname changes every time cloudflared restarts.
       */
      const REPO = 'wydgetlabsadmin/pocket-link';
      /*
       * Order matters. `raw.githubusercontent.com` keeps serving the file it
       * has cached for ~5 minutes and ignores the cache-busting query, so after
       * a tunnel rotation it happily hands back the previous address; the REST
       * contents endpoint is dynamic and not CDN-cached. Raw stays as a
       * fallback for when the unauthenticated API rate limit is exhausted.
       */
      const SOURCES = [
        `https://api.github.com/repos/${REPO}/contents/current.json`,
        `https://raw.githubusercontent.com/${REPO}/main/current.json`,
      ];

      const el = (id) => document.getElementById(id);

      function fail(title, detail) {
        el('spin').hidden = true;
        el('title').textContent = title;
        el('detail').textContent = detail;
        el('retry').hidden = false;
      }

      function bytesFromBase64Url(value) {
        const padded = value.replace(/-/g, '+').replace(/_/g, '/');
        const raw = atob(padded + '='.repeat((4 - (padded.length % 4)) % 4));
        return Uint8Array.from(raw, (character) => character.charCodeAt(0));
      }

      /** The API wraps the file in base64; raw hands back the JSON directly. */
      function unwrap(body) {
        if (typeof body?.iv === 'string' && typeof body?.ct === 'string') return body;
        if (typeof body?.content === 'string') {
          const text = new TextDecoder().decode(
            bytesFromBase64Url(body.content.replace(/\s/g, '')),
          );
          const parsed = JSON.parse(text);
          if (typeof parsed.iv === 'string' && typeof parsed.ct === 'string') return parsed;
        }
        return null;
      }

      async function fetchBlob(source) {
        const response = await fetch(`${source}?t=${Date.now()}`, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return unwrap(await response.json());
      }

      /**
       * A stale blob is worse than useless: it sends the phone to a hostname
       * that no longer exists. So each candidate is *probed* first — an opaque
       * no-cors request counts as up for any HTTP status (a 401 still proves
       * something answered), and only a real network failure rejects.
       */
      async function reachable(url) {
        try {
          await fetch(`${url}/api/remote/status`, {
            mode: 'no-cors',
            cache: 'no-store',
            signal: AbortSignal.timeout(6000),
          });
          return true;
        } catch {
          return false;
        }
      }

      async function main() {
        const key = location.hash.replace(/^#/, '').trim();
        if (!key) {
          fail('Missing key', 'Open the link with its #key on the end.');
          return;
        }
        let cryptoKey;
        try {
          cryptoKey = await crypto.subtle.importKey('raw', bytesFromBase64Url(key), 'AES-GCM', false, [
            'decrypt',
          ]);
        } catch {
          fail('Wrong link', 'This bookmark no longer matches the key.');
          return;
        }

        let read = false;
        let target = null;
        for (const source of SOURCES) {
          let candidate;
          try {
            const blob = await fetchBlob(source);
            if (!blob) continue;
            read = true;
            const plain = await crypto.subtle.decrypt(
              { name: 'AES-GCM', iv: bytesFromBase64Url(blob.iv) },
              cryptoKey,
              bytesFromBase64Url(blob.ct),
            );
            candidate = JSON.parse(new TextDecoder().decode(plain));
          } catch {
            continue;
          }
          el('detail').textContent = new URL(candidate.url).host;
          if (await reachable(candidate.url)) {
            target = candidate;
            break;
          }
        }

        if (!target) {
          fail(
            read ? 'Mac offline' : 'Could not read the address',
            read
              ? 'The Mac answered with an address that is not reachable right now.'
              : 'Is the Mac online? This page cannot reach GitHub either.',
          );
          return;
        }
        const host = new URL(target.url).host;
        el('title').textContent = 'Connecting…';
        el('detail').textContent = host;
        location.replace(`${target.url}/?token=${encodeURIComponent(target.token)}`);
      }

      el('retry').addEventListener('click', () => {
        el('retry').hidden = true;
        el('spin').hidden = false;
        el('title').textContent = 'Opening Codex…';
        el('detail').textContent = 'Finding your Mac.';
        main();
      });

      main();
    </script>
  </body>
</html>
